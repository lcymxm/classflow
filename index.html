<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f4f1e8" />
    <meta
      name="description"
      content="课序 ClassFlow —— 本地优先的大学课表。周视图、课程管理、今日提醒、日历导出，离线可用。"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="课序" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <script>
      try {
        var preferences = JSON.parse(localStorage.getItem("kexu:prefs:v1") || "{}");
        var storedTheme = preferences.theme;
        var theme =
          storedTheme === "dark" || storedTheme === "whale" || storedTheme === "light"
            ? storedTheme
            : window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
        document.documentElement.dataset.theme = theme;
        var themeMeta = document.querySelector('meta[name="theme-color"]');
        if (themeMeta) {
          themeMeta.setAttribute("content", theme === "dark" ? "#101613" : theme === "whale" ? "#071426" : "#f4f1e8");
        }
      } catch (error) {
        document.documentElement.dataset.theme = "light";
      }
    </script>
    <title>课序 · ClassFlow</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
