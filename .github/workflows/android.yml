name: Build Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.28.5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Configure Android SDK
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          if [ ! -d "$SDK_ROOT" ]; then
            echo "Android SDK not found at $SDK_ROOT"
            exit 1
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          CMDLINE_TOOLS=$(dirname "$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f | head -1)")
          echo "$CMDLINE_TOOLS" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          "$CMDLINE_TOOLS/sdkmanager" --version
          yes | "$CMDLINE_TOOLS/sdkmanager" --licenses >/dev/null || true
          "$CMDLINE_TOOLS/sdkmanager" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Build web app
        run: pnpm build

      - name: Sync Capacitor Android project
        run: pnpm exec cap sync android

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build unsigned release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -x lint -x lintVitalRelease --no-daemon

      - name: Sign APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEYSTORE_TYPE: ${{ secrets.ANDROID_KEYSTORE_TYPE }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          BUILDS="$RUNNER_TEMP/android-signing"
          mkdir -p "$BUILDS"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$BUILDS/release.p12"
          test -s "$BUILDS/release.p12"

          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          APK_IN="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          APK_ALIGNED="$BUILDS/classflow-aligned.apk"
          APK_OUT="$BUILDS/classflow-${VERSION}.apk"
          test -f "$APK_IN"

          "$BUILD_TOOLS/zipalign" -f -p 4 "$APK_IN" "$APK_ALIGNED"
          "$BUILD_TOOLS/apksigner" sign \
            --ks-type "$ANDROID_KEYSTORE_TYPE" \
            --ks "$BUILDS/release.p12" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass "pass:$ANDROID_KEYSTORE_PASSWORD" \
            --key-pass "pass:$ANDROID_KEY_PASSWORD" \
            --out "$APK_OUT" \
            "$APK_ALIGNED"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK_OUT"
          (cd "$BUILDS" && sha256sum "classflow-${VERSION}.apk" > "classflow-${VERSION}.apk.sha256")
          mkdir -p dist-android
          cp "$APK_OUT" "dist-android/classflow-${VERSION}.apk"
          cp "$BUILDS/classflow-${VERSION}.apk.sha256" "dist-android/"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: classflow-apk
          path: dist-android/
          if-no-files-found: error

      - name: Publish APK to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-android/*
          generate_release_notes: true
          name: 课序 ${{ github.ref_name }}
          body: |
            ## 课序 ${{ github.ref_name }}

            Android 离线版 APK。首次安装需在系统设置中允许「安装未知应用」。

            - 包名：`io.github.lcymxm.classflow`
            - 最低系统：Android 7.0（API 24）
            - 文件：见本 Release 的 `classflow-*.apk` 附件
            - 校验：同目录下的 `.sha256` 文件

            课表数据只保存在手机本机；换机前请在「设置 → 数据与备份」导出 JSON。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
